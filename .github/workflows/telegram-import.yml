name: Telegram import

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Import public Telegram sources
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 60 \
            https://podrabotka154.vercel.app/api/telegram/import-public
