name: import public Telegram

on:
  schedule:
    - cron: "7-57/5 * * * *"
  workflow_dispatch:

concurrency:
  group: public-telegram-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.PODRABOTKA154_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PODRABOTKA154_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Test Supabase network
        env:
          SUPABASE_URL: ${{ secrets.PODRABOTKA154_SUPABASE_URL }}
        run: |
          set -euo pipefail
          echo "Supabase host: $(printf '%s' "$SUPABASE_URL" | sed -E 's#https?://([^/]+).*#\1#')"
          ipv4_code="$(curl -4 -sS --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' "$SUPABASE_URL/rest/v1/" || true)"
          ipv6_code="$(curl -6 -sS --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' "$SUPABASE_URL/rest/v1/" || true)"
          echo "IPv4 HTTP ${ipv4_code}"
          echo "IPv6 HTTP ${ipv6_code}"
          test "$ipv4_code" != "000"
      - name: Import public Telegram directly into Supabase
        env:
          PODRABOTKA154_SUPABASE_URL: ${{ secrets.PODRABOTKA154_SUPABASE_URL }}
          PODRABOTKA154_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PODRABOTKA154_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run import-public
