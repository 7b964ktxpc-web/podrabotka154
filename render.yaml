services:
  - type: web
    name: podrabotka154
    runtime: node
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: podrabotka154-public-telegram-import
    runtime: node
    branch: main
    buildCommand: npm install
    startCommand: npm run import-public
    schedule: "*/15 * * * *"
    envVars:
      - key: APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false
