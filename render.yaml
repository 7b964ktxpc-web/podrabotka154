services:
  - type: web
    name: podrabotka154
    runtime: node
    branch: render
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        sync: false

  - type: cron
    name: podrabotka154-telegram-import
    runtime: node
    branch: render
    schedule: "*/15 * * * *"
    buildCommand: npm install
    startCommand: curl --fail --show-error --silent --max-time 60 -H "Authorization: Bearer ${CRON_SECRET}" https://podrabotka154.onrender.com/api/telegram/import-public
    envVars:
      - key: CRON_SECRET
        sync: false
