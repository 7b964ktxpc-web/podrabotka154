services:
  - type: web
    name: podrabotka154
    runtime: node
    branch: main
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: PUSH_PUBLIC_KEY
        sync: false
      - key: PUSH_PRIVATE_KEY
        sync: false
      - key: PUSH_SUBJECT
        sync: false
