name: import public Telegram

on:
  schedule:
    - cron: "7-57/5 * * * *"
  workflow_dispatch:

concurrency:
  group: public-telegram-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate secrets
        env:
          PODRABOTKA154_APP_URL: ${{ secrets.PODRABOTKA154_APP_URL }}
          PODRABOTKA154_CRON_SECRET: ${{ secrets.PODRABOTKA154_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$PODRABOTKA154_APP_URL"
          test -n "$PODRABOTKA154_CRON_SECRET"
      # t.me is unreachable from GitHub Actions runners, so this job only
      # triggers the production app, which fetches Telegram and drains the
      # parse queue in the same request.
      - name: Trigger production import
        env:
          PODRABOTKA154_APP_URL: ${{ secrets.PODRABOTKA154_APP_URL }}
          PODRABOTKA154_CRON_SECRET: ${{ secrets.PODRABOTKA154_CRON_SECRET }}
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 120 \
            "${PODRABOTKA154_APP_URL}/api/telegram/import-public" \
            -H "Authorization: Bearer ${PODRABOTKA154_CRON_SECRET}"