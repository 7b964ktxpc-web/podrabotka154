name: process notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: notifications-worker
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate worker secrets
        env:
          SUPABASE_URL: ${{ secrets.PODRABOTKA154_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PODRABOTKA154_SUPABASE_SERVICE_ROLE_KEY }}
          PUSH_PUBLIC_KEY: ${{ secrets.PODRABOTKA154_PUSH_PUBLIC_KEY }}
          PUSH_PRIVATE_KEY: ${{ secrets.PODRABOTKA154_PUSH_PRIVATE_KEY }}
          PUSH_SUBJECT: ${{ secrets.PODRABOTKA154_PUSH_SUBJECT }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$PUSH_PUBLIC_KEY"
          test -n "$PUSH_PRIVATE_KEY"
          test -n "$PUSH_SUBJECT"
      - name: Process queue
        env:
          SUPABASE_URL: ${{ secrets.PODRABOTKA154_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PODRABOTKA154_SUPABASE_SERVICE_ROLE_KEY }}
          PUSH_PUBLIC_KEY: ${{ secrets.PODRABOTKA154_PUSH_PUBLIC_KEY }}
          PUSH_PRIVATE_KEY: ${{ secrets.PODRABOTKA154_PUSH_PRIVATE_KEY }}
          PUSH_SUBJECT: ${{ secrets.PODRABOTKA154_PUSH_SUBJECT }}
          PARSER_PROVIDER: conservative
          WORKER_BATCH_SIZE: 20
        run: npm run worker:once
